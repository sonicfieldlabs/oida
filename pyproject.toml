[project]
name = "oida"
version = "0.1.0"
description = "oída local listening agent: MOSS-Audio daemon, AKOUO routing, live buffers, and Akousmata memory."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Sonic Field Labs" }]
dependencies = [
  "fastapi>=0.115",
  "jsonschema>=4.22",
  "numpy>=1.26",
  "pydantic>=2.8",
  "scipy>=1.12",
  "soundfile>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
moss = [
  "torch>=2.9",
  "transformers==4.57.1",
  "torchcodec>=0.9,<1.0"
]
dev = [
  "httpx>=0.27",
  "pytest>=8.2"
]

[project.scripts]
oida = "oida.cli:main"
oida-daemon = "oida.server:main"
ear = "harness.ear_cli.cli:main"
akoe = "harness.akoe_cli:main"
# backward-compat aliases (previous names: AEAR, then hmm)
hmm = "oida.cli:main"
aear = "oida.cli:main"
aear-daemon = "oida.server:main"
hmm-daemon = "oida.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oida", "harness", "bench_adapter"]
artifacts = ["oida/static/*", "oida/schemas/*"]
