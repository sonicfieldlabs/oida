[project]
name = "sonicfield-oida"
version = "0.12.1"
description = "oída unified local listening agent and gateway: AKOÚŌ, Earworm, Akousmata, and optional local audio engines."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sonic Field Labs" }]
keywords = ["audio", "listening", "sound-analysis", "FastAPI", "MCP"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "anyio>=4.14.2,<5",
  "akouo-contract>=0.10.1",
  "akousma>=0.8.4",
  "akousmata>=0.8.3",
  "fastapi>=0.139",
  "httpx2>=2.12,<3",
  "jsonschema>=4.22",
  "mcp>=1.27,<2",
  "numpy>=1.26",
  "pydantic>=2.8",
  "referencing>=0.35",
  "scipy>=1.12",
  "soundfile>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.urls]
Homepage = "https://github.com/sonicfieldlabs/oida"
Repository = "https://github.com/sonicfieldlabs/oida"
Issues = "https://github.com/sonicfieldlabs/oida/issues"

[tool.uv.sources]
# Reviewed wheels include packaged resources and cannot be masked by siblings.
akousma = { path = "vendor/akousma-0.8.4-py3-none-any.whl" }
akouo-contract = { path = "vendor/akouo_contract-0.10.1-py3-none-any.whl" }
akousmata = { path = "vendor/akousmata-0.8.3-py3-none-any.whl" }

[project.optional-dependencies]
moss = [
    "fsspec>=2026.6.0",
  "accelerate>=1.15.0",
  "torch==2.10.0",
  "torchaudio==2.10.0",
  "transformers==5.14.1",
  "torchcodec==0.10.0"
]
dev = [
  "pytest>=8.2",
  "ruff>=0.15,<0.16",
  "twine>=7,<8",
]
songid = [
    "multidict>=6.9.1",
  "shazamio>=0.4",
  "audioop-lts>=0.2.2; python_version >= '3.13'"
]

[project.scripts]
oida = "oida.cli:main"
oida-daemon = "oida.server:main"
oida-mcp = "oida.mcp_server:main"
ear = "harness.ear_cli.cli:main"
akoe = "harness.akoe_cli:main"
# backward-compat aliases (previous names: AEAR, then hmm)
hmm = "oida.cli:main"
aear = "oida.cli:main"
aear-daemon = "oida.server:main"
hmm-daemon = "oida.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oida", "harness", "bench_adapter"]
artifacts = ["oida/static/*", "oida/schemas/*"]

[tool.hatch.build.targets.wheel.force-include]
"integrations" = "oida/integration_assets"

# Explicit source inputs exclude local reports, plans and operator state.
[tool.hatch.build.targets.sdist]
include = ["oida", "harness", "bench_adapter", "integrations", "pyproject.toml", "README.md", "LICENSE", "NOTICE", "vendor/*.whl", "vendor/SHA256SUMS", "vendor/compatibility.json", "vendor/NOTICE.md"]
