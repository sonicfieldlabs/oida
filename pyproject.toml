[project]
name = "hmm"
version = "0.1.0"
description = "hmm local listening agent: MOSS-Audio daemon, AKOUO routing, live buffers, and Akousmata memory."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Sonic Field" }]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "httpx2>=2.5.0",
  "jsonschema>=4.22",
  "numpy>=1.26",
  "pydantic>=2.8",
  "scipy>=1.12",
  "soundfile>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
moss = [
  "torch>=2.9",
  "transformers==4.57.1",
  "torchcodec>=0.9,<1.0"
]
dev = [
  "pytest>=8.2"
]

[project.scripts]
hmm = "aear.cli:main"
ear = "harness.ear_cli.cli:main"
akoe = "harness.akoe_cli:main"
aear = "aear.cli:main"
aear-daemon = "aear.server:main"
hmm-daemon = "aear.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aear", "harness", "bench_adapter"]
artifacts = ["aear/static/*", "aear/schemas/*"]
