[project]
name = "sonicfield-oida"
version = "0.6.5"
description = "oída unified local listening agent and gateway: AKOÚŌ, Earworm, Akousmata, and optional local audio engines."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sonic Field Labs" }]
keywords = ["audio", "listening", "sound-analysis", "FastAPI", "MCP"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "akouo-contract>=0.7.0",
  "akousma>=0.4.0",
  "akousmata>=0.4.0",
  "fastapi>=0.139",
  "jsonschema>=4.22",
  "mcp>=1.27,<2",
  "numpy>=1.26",
  "pydantic>=2.8",
  "referencing>=0.35",
  "scipy>=1.12",
  "soundfile>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.urls]
Homepage = "https://github.com/sonicfieldlabs/oida"
Repository = "https://github.com/sonicfieldlabs/oida"
Issues = "https://github.com/sonicfieldlabs/oida/issues"

[tool.uv.sources]
akousma = { path = "../earworm/packages/py-akousma", editable = true }
akouo-contract = { path = "../akouo", editable = true }
akousmata = { path = "../akousmata", editable = true }

[project.optional-dependencies]
moss = [
  "accelerate",
  "torch==2.10.0",
  "torchaudio==2.10.0",
  "transformers==5.14.1",
  "torchcodec==0.10.0"
]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
  "ruff>=0.15,<0.16",
  "twine>=6.2,<7",
]
songid = [
  "shazamio>=0.4",
  "audioop-lts>=0.2.2; python_version >= '3.13'"
]

[project.scripts]
oida = "oida.cli:main"
oida-daemon = "oida.server:main"
oida-mcp = "oida.mcp_server:main"
ear = "harness.ear_cli.cli:main"
akoe = "harness.akoe_cli:main"
# backward-compat aliases (previous names: AEAR, then hmm)
hmm = "oida.cli:main"
aear = "oida.cli:main"
aear-daemon = "oida.server:main"
hmm-daemon = "oida.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oida", "harness", "bench_adapter"]
artifacts = ["oida/static/*", "oida/schemas/*"]

[tool.hatch.build.targets.wheel.force-include]
"integrations" = "oida/integration_assets"
