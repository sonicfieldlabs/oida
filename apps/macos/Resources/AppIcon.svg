<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- oída — the listening point.
       One small warm dot (the akousma, the heard thing) and three incomplete
       arcs around it: an ear's folds, a sound arriving, a point on the
       listening map. The arcs open toward the lower left — the gap is the
       part the ear does not claim to have heard. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31302b"/>
      <stop offset="1" stop-color="#232320"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <g fill="none" stroke="#f4f3ee" stroke-linecap="round">
    <path d="M 541.4 675.9 A 150 150 0 1 0 342.1 476.6" stroke-width="48"/>
    <path d="M 609.0 766.9 A 262 262 0 1 0 251.1 409.0" stroke-width="38" opacity="0.82"/>
    <path d="M 692.5 846.4 A 374 374 0 1 0 171.6 325.5" stroke-width="30" opacity="0.62"/>
  </g>
  <circle cx="478" cy="540" r="62" fill="#a9762f"/>
</svg>
