name: CI

on:
  workflow_call:
    inputs:
      release_ref:
        description: Optional immutable release ref selected by the publishing workflow
        required: false
        type: string
        default: ""
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Reusable CI must not share the calling release workflow concurrency group.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python, Web, and macOS checks
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.14.10"
      UV_PYTHON_DOWNLOADS: never
    defaults:
      run:
        working-directory: oida
    steps:
      - name: Checkout Oída
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_ref || github.ref }}
          path: oida

      - name: Use a maintained CI Python patch
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.10"
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Verify reviewed canonical dependency wheels
        run: shasum -a 256 -c vendor/SHA256SUMS

      - name: Install audio fixture tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: command -v ffmpeg >/dev/null || brew install ffmpeg

      - name: Install Python dependencies
        run: uv sync --extra dev --locked

      # pytest collects the unittest.TestCase suite too; one runner is enough.
      - name: Run Python tests
        run: uv run pytest -q -W error::starlette.exceptions.StarletteDeprecationWarning

      - name: Lint Python
        run: uv run ruff check .

      - name: Compile Python modules
        run: uv run python -m compileall -q oida harness bench_adapter scripts tests

      - name: Audit full registry graph without advisory suppressions
        run: |
          uv export --locked --all-extras --no-emit-project --no-emit-local > "$RUNNER_TEMP/dependencies.txt"
          uv run python scripts/audit_dependencies.py \
            --requirements "$RUNNER_TEMP/dependencies.txt" \
            --output "$RUNNER_TEMP/dependency-audit.json"

      - name: Check dashboard JavaScript
        run: |
          node --check oida/static/app.js
          node --check oida/static/remote.js

      - name: Build Python distributions and canonical dependency wheels
        run: |
          uv build
          mkdir -p "$RUNNER_TEMP/oida-wheels"
          cp vendor/*.whl "$RUNNER_TEMP/oida-wheels/"

      - name: Check Python distribution metadata
        run: uv run twine check dist/*

      - name: Smoke isolated Python wheel
        working-directory: ${{ runner.temp }}
        env:
          UV_FIND_LINKS: ${{ runner.temp }}/oida-wheels
        run: >-
          uv run --isolated --no-project
          --with "$GITHUB_WORKSPACE"/oida/dist/sonicfield_oida-*.whl
          python -c 'import importlib.resources as r; import oida, oida.reasoning.audio_router, oida.server; assert r.files("oida").joinpath("integration_assets", "codex", "README.md").is_file(); print(oida.__version__)'

      - name: Build macOS shell
        working-directory: oida/apps/macos
        run: |
          swift build
          swift build -Xswiftc -strict-concurrency=complete

      - name: Package unsigned app
        run: apps/macos/script/package_unsigned.sh

      - name: Release smoke
        run: scripts/release_smoke_with_stub.sh

  optional-native:
    name: Optional native audio fixture
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OIDA_ALLOW_HF_HUB: "0"
      UV_PYTHON: "3.14.10"
      UV_PYTHON_DOWNLOADS: never
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.10"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.7"
      - name: Verify canonical wheels
        run: shasum -a 256 -c vendor/SHA256SUMS
      - name: Bind FFmpeg shared libraries
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          library_dir="$(brew --prefix ffmpeg)/lib"
          test -d "$library_dir"
          {
            echo "DYLD_LIBRARY_PATH=$library_dir"
            echo "DYLD_FALLBACK_LIBRARY_PATH=$library_dir"
            echo "OIDA_FFMPEG_LIB_DIR=$library_dir"
          } >> "$GITHUB_ENV"
      - name: Install locked optional SDK without model weights
        run: uv sync --locked --extra moss
      - name: Exercise synthetic CPU audio and SDK imports
        run: uv run --locked --extra moss python scripts/smoke_optional_torch.py
