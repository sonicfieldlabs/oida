version: 2
updates:
  - package-ecosystem: uv
    directories:
      - "/"
    schedule:
      interval: cron
      cronjob: "0 10 21 * *"
      timezone: America/Bogota
    open-pull-requests-limit: 1
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      compatible-uv:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: cron
      cronjob: "0 10 21 * *"
      timezone: America/Bogota
    open-pull-requests-limit: 1
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      compatible-github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
